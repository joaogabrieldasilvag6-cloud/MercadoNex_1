<section class="dashboard-section">

    <div class="section-header">

        <div>

            <h2>
                📅 Controle de Validade
            </h2>

            <p>
                Acompanhe os produtos vencidos e os próximos do vencimento.
            </p>

        </div>

    </div>

    <!-- Cards -->

    <div class="stats-grid">

        <div class="stat-card card-vencimento" data-filtro="vencidos">

            <div class="stat-icon red">
                📅
            </div>

            <div class="stat-body">

                <div
                    class="stat-value"
                    id="total-vencidos">

                    0

                </div>

                <div class="stat-label">

                    Produtos Vencidos

                </div>

            </div>

        </div>


        <div class="stat-card card-vencimento" data-filtro="7dias">

            <div class="stat-icon orange">

                ⚠️

            </div>

            <div class="stat-body">

                <div
                    class="stat-value"
                    id="total-7dias">

                    0

                </div>

                <div class="stat-label">

                    Até 7 dias

                </div>

            </div>

        </div>


        <div class="stat-card card-vencimento" data-filtro="30dias">

            <div class="stat-icon green">

                ✅

            </div>

            <div class="stat-body">

                <div
                    class="stat-value"
                    id="total-30dias">

                    0

                </div>

                <div class="stat-label">

                    Até 30 dias

                </div>

            </div>

        </div>

    </div>


    <!-- Lista -->

    <div
        id="painel-vencimentos"
        class="dashboard-section"
        style="margin-top:30px;">

        <div class="section-header">

            <h3 id="titulo-lista">

                Produtos

            </h3>

        </div>

        <div class="table-container">

            <table class="dashboard-table">

                <thead>

                    <tr>

                        <th>Produto</th>

                        <th>Categoria</th>

                        <th>Validade</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="lista-produtos-vencimento">

                </tbody>

            </table>

        </div>

    </div>

</section>
