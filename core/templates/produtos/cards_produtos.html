
<div class="stats-grid">

    <!-- Total de Produtos -->
    <div class="stat-card">
        <div class="stat-icon blue">
            📦
        </div>

        <div class="stat-body">
            <div class="stat-value">
                {{ total_produtos|default:"0" }}
            </div>

            <div class="stat-label">
                Produtos cadastrados
            </div>
        </div>
    </div>

    <!-- Produtos Ativos -->
    <div class="stat-card">
        <div class="stat-icon green">
            ✅
        </div>

        <div class="stat-body">
            <div class="stat-value">
                {{ produtos_ativos|default:"0" }}
            </div>

            <div class="stat-label">
                Produtos ativos
            </div>
        </div>
    </div>

    <!-- Estoque Baixo -->
    <div class="stat-card">
        <div class="stat-icon yellow">
            ⚠️
        </div>

        <div class="stat-body">
            <div class="stat-value">
                {{ estoque_baixo|default:"0" }}
            </div>

            <div class="stat-label">
                Estoque baixo
            </div>
        </div>
    </div>

    <!-- Produtos em Destaque -->
    <div class="stat-card">
        <div class="stat-icon purple">
            ⭐
        </div>

        <div class="stat-body">
            <div class="stat-value">
                {{ produtos_destaque|default:"0" }}
            </div>

            <div class="stat-label">
                Produtos em destaque
            </div>
        </div>
    </div>

</div>
